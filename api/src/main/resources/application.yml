spring:
  application:
    name: api

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:restoforge}"
    username: ${POSTGRES_USER:restoforge}
    password: ${POSTGRES_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always

# Profil dev : ajoute les données de démonstration de db/seed aux migrations de
# schéma. Sans profil actif, seul db/migration est appliqué — le seed n'atteint
# donc jamais un environnement déployé.
---
spring:
  config:
    activate:
      on-profile: dev

  flyway:
    locations: classpath:db/migration,classpath:db/seed
